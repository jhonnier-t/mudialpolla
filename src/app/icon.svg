<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Polla Mundialista 2026 — balón sobre fondo esmeralda -->
  <rect width="64" height="64" rx="14" fill="#059669"/>
  <circle cx="32" cy="32" r="20" fill="#ffffff"/>
  <!-- pentágono central -->
  <polygon points="32,24 39.6,29.5 36.7,38.5 27.3,38.5 24.4,29.5" fill="#0f172a"/>
  <!-- costuras hacia el borde -->
  <g stroke="#0f172a" stroke-width="2.6" stroke-linecap="round">
    <line x1="32" y1="24" x2="32" y2="12.5"/>
    <line x1="39.6" y1="29.5" x2="50.6" y2="25.9"/>
    <line x1="36.7" y1="38.5" x2="43.5" y2="47.8"/>
    <line x1="27.3" y1="38.5" x2="20.5" y2="47.8"/>
    <line x1="24.4" y1="29.5" x2="13.4" y2="25.9"/>
  </g>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#0f172a" stroke-width="3"/>
</svg>
